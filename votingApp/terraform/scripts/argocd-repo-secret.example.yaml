# ArgoCD Repository Secret Template
# DO NOT commit argocd-repo-secret.yaml — it is in .gitignore
#
# Usage:
#   1. Copy this file: cp argocd-repo-secret.example.yaml argocd-repo-secret.yaml
#   2. Replace <AZURE_DEVOPS_USERNAME> and <AZURE_DEVOPS_PAT>
#   3. Apply: kubectl apply -f argocd-repo-secret.yaml
#   4. Never commit argocd-repo-secret.yaml

apiVersion: v1
kind: Secret
metadata:
  name: votingapp-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: https://<AZURE_DEVOPS_USERNAME>@dev.azure.com/<ORG>/<PROJECT>/_git/<REPO>
  username: <AZURE_DEVOPS_USERNAME>
  password: <AZURE_DEVOPS_PAT>
